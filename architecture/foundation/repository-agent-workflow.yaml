schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:files
    extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts]
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: docs
    script: docs:check
    extensions: [.md]
    passPaths: false
  - id: architecture
    script: architecture:check
    extensions: [.json, .yaml, .yml]
    passPaths: false
  - id: architecture-review
    script: architecture:review
    extensions: [.md]
    passPaths: false
  - id: architecture-tests
    script: architecture:test
    extensions: [.mjs]
    passPaths: false
fullScanPaths:
  - .agents/skills/docs-authoring/SKILL.md
  - .github/copilot-instructions.md
  - .github/dependabot.yml
  - .github/workflows
  - .markdownlint-cli2.mjs
  - .node-version
  - .npmrc
  - .oxlintrc.json
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - README.md
  - architecture/decisions
  - architecture/foundation
  - architecture/package-catalog.yaml
  - architecture/project-management
  - architecture/scaffolding
  - docs
  - foundation.config.yaml
  - package.json
  - packages/contexts
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - scripts/architecture
  - scripts/docs
  - tooling/executable-specifications
  - tsconfig.json
