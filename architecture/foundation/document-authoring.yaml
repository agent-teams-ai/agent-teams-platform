schemaVersion: 3
projectId: agent-teams-platform
catalog:
  metadataSchemaPath: docs/metadata.schema.json
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates
authoring:
  mode: create-only
  ownerSets:
    schemaVersion: 1
    sets:
      adr-owners:
        - architecture/deployment
        - architecture/domain
        - product/authority
        - product/customer-ownership
        - product/deployment-management
        - product/project-lifecycle
        - project-management
        - security/operations
      architecture-owners:
        - architecture
        - architecture/authority
        - architecture/deployment
        - architecture/domain
        - architecture/integration
        - architecture/provisioning
        - project-management
      bounded-context-owners:
        - product/access-authority
        - product/commercial-access
        - product/customer-ownership
        - product/deployment-management
        - product/platform-identity
        - product/project-management
        - product/tenancy
  artifactTypes:
    - type: adr
      initialStatus: proposed
      identity: {kind: explicit, format: adr-four-digits}
      placement:
        kind: collection
        directory: docs/decisions
        filename: numeric-id-slug
      template: {kind: fenced-markdown-body, path: docs/templates/adr.md}
      heading: {kind: id-colon-title}
      ownerSetId: adr-owners
      reachability:
        kind: manual-fixed-index
        indexPath: docs/decisions/README.md
    - type: architecture
      initialStatus: proposed
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - architecture
          minSuffixSegments: 1
          maxSuffixSegments: 1
      placement:
        kind: collection
        directory: docs/architecture
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/architecture.md
      heading: {kind: title}
      ownerSetId: architecture-owners
      reachability:
        kind: manual-fixed-index
        indexPath: docs/architecture/README.md
    - type: bounded-context
      initialStatus: proposed
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - domain
            - contexts
          minSuffixSegments: 1
          maxSuffixSegments: 1
      placement:
        kind: qualified-leaf-index
        root: docs/domain/contexts
        requiredBasename: README.md
      template:
        kind: fenced-markdown-body
        path: docs/templates/bounded-context.md
      heading: {kind: title}
      ownerSetId: bounded-context-owners
      reachability:
        kind: manual-fixed-index
        indexPath: docs/domain/contexts/README.md
