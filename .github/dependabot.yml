version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 0
    groups:
      engineering-foundation:
        patterns:
          - "@agent-teams/engineering-foundation"
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "@agent-teams/engineering-foundation"
